<!DOCTYPE html>
<html>
<head>
  <style>
    /* Internal CSS: Selects any <p> that is a descendant of <div> */
    div p {
      color: blue;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div>
    <p>I am blue because I'm inside the div.</p>
    <span>
      <p>I am also blue (even though I'm inside a span, I'm still a descendant of the div).</p>
    </span>
  </div>

  <p>I am NOT blue because I am outside the div.</p>

</body>
</html>
