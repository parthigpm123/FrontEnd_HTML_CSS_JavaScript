<!DOCTYPE html>
<html>
<head>
    <style>
        /* Element Selector: targets all <h1> tags */
        h1 {
            color: navy;
            text-align: center;
        }

        /* Element Selector: targets all <p> tags */
        p {
            font-family: Arial, sans-serif;
            font-size: 16px;
            color: #c90505;
        }
    </style>
</head>
<body>
    <h1>This is a Heading</h1>
    <p>This paragraph will be styled by the internal CSS element selector.</p>
    <p>This paragraph will also receive the same styling.</p>
</body>
</html>
