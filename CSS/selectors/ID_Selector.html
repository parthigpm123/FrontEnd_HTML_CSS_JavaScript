<!DOCTYPE html>
<html>
<head>
    <style>
        /* Internal CSS using an ID selector */
        #main-header {
            color: blue;
            text-align: center;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>

    <!-- The HTML element with the unique ID -->
    <h1 id="main-header">Hello, World!</h1>
    
    <p>This is a regular paragraph that won't be affected by the ID style.</p>

</body>
</html>
