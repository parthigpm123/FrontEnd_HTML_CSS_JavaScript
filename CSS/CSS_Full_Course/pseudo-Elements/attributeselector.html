<!DOCTYPE html>
<html>
<head>
    <style>
        /* CSS rule using an attribute selector */
        input[type="text"] {
            background-color: lightblue;
            border: 2px solid blue;
        }
        input[type="password"] {
            background-color: lightgray;
        }
    </style>
</head>
<body>
    <input type="text" placeholder="Enter text">
    <input type="password" placeholder="Enter password">
</body>
</html>
