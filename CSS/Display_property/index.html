<!--
block: Elements start on a new line and occupy the full width, allowing for width, height, and margin adjustments (e.g., <div>, <p>).

inline: Elements sit within a line of text, taking up only necessary space (e.g., <span>, <a>), with restricted width/height control.

inline-block: Combines features, allowing elements to sit inline while maintaining width/height control.
none: Completely removes the element from the document flow, unlike visibility: hidden.

flex / grid: Enables modern layout models for one-dimensional (flex) or two-dimensional (grid) alignment.
