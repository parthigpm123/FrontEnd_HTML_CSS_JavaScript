The HTML <fieldset> element is used to group related elements within a web form both visually and semantically, improving accessibility and structure. By default, it draws a box or border around the grouped content.

<form action="/submit_form" method="post">
    <fieldset>
        <legend>Personal Information</legend>
        <label for="fname">First name:</label>
        <input type="text" id="fname" name="fname"><br>
        <label for="lname">Last name:</label>
        <input type="text" id="lname" name="lname"><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email">
    </fieldset>
    <input type="submit" value="Submit">
</form>
