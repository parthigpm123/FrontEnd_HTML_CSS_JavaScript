
<!DOCTYPE html>
<html lang="en">
      
<head>
      
    <meta charset="UTF-8">
    <title>Colorful Contact Us</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .contact-container { width: 80%; max-width: 500px; background: #fff; padding: 30px; border-radius: 15px; box-shadow: 0 0 20px rgba(0, 0, 0, 0.2); }
        h1 { text-align: center; color: #333; border-bottom: 2px solid #007bff; padding-bottom: 10px; }
        label { display: block; color: #007bff; font-weight: bold; margin-bottom: 5px; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; margin-bottom: 16px; }
        input:focus, textarea:focus { outline: none; border-color: #ff5733; }
        button { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>
    <div class="contact-container">
        <h1>Contact Us</h1>
        <form>
            <label>Name</label><input type="text" required>
            <label>Email</label><input type="email" required>
            <label>Message</label><textarea rows="4"></textarea>
            <button type="submit">Send</button>
        </form>
    </div>
</body>
</html>

<input type="button" value="Submit">
